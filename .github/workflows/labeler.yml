name: Auto Labeler

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:

      - name: Auto-label PR based on changes
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo, number } = context.issue;
            const { data: prData } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: number
            });

            const { data: files } = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number: number
            });

            const labels = new Set();

            // Determine labels based on changed files
            files.forEach(file => {
              if (file.filename.includes('package.json') || file.filename.includes('package-lock.json')) {
                labels.add('dependencies');
              }
              if (file.filename.startsWith('.github')) {
                labels.add('ci/cd');
              }
              if (file.filename.includes('.tsx') || file.filename.includes('.ts')) {
                labels.add('typescript');
              }
              if (file.filename.includes('README') || file.filename.includes('.md')) {
                labels.add('documentation');
              }
              if (file.filename.includes('tailwind') || file.filename.includes('css')) {
                labels.add('styling');
              }
            });

            // Determine labels based on PR title
            const prTitle = prData.title.toLowerCase();
            if (prTitle.includes('fix') || prTitle.includes('bug')) {
              labels.add('bug');
            } else if (prTitle.includes('feat') || prTitle.includes('feature')) {
              labels.add('enhancement');
            } else if (prTitle.includes('refactor')) {
              labels.add('refactor');
            }

            // Add labels to PR
            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: number,
                labels: Array.from(labels)
              });
            }
