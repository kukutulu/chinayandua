name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm install thay vì npm ci: @tailwindcss/oxide-wasm32-wasi khai báo
      # bundleDependencies (@emnapi/*) mà npm không resolve đủ cross-platform
      # (lock sinh trên win32 thiếu subtree này, runner linux fail EUSAGE).
      # npm install vẫn tôn trọng version trong lock, giống hệt Vercel build.
      - run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Audit (fail on high and above)
        run: npm audit --audit-level=high
